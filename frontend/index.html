<!DOCTYPE html>
<html>
<head>
  <title>Android Emulator Stream</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    video {
      width: 400px;
      max-width: 90vw;
      border: 2px solid #333;
      background: black;
    }

    #status {
      margin: 15px;
    }
  </style>
</head>

<body>

  <h2>Android Emulator</h2>

  <p id="status">Connecting...</p>

  <video
  id="video"
  autoplay
  muted
  playsinline
  tabindex="0"
></video>

  <script>
    const socket = new WebSocket(
      "ws://" + window.location.host + "/ws"
    );
    const video = document.getElementById("video");
    const status = document.getElementById("status");
    video.addEventListener("click", (event) => {
        video.focus();
  const rect = video.getBoundingClientRect();

  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;

  const videoX = x * (video.videoWidth / rect.width);
  const videoY = y * (video.videoHeight / rect.height);

  console.log("Browser tap:", videoX, videoY);

  socket.send(JSON.stringify({
    type: "tap",
    x: videoX,
    y: videoY
  }));
});
let swipeStart = null;

video.addEventListener("pointerdown", (event) => {
  const rect = video.getBoundingClientRect();

  swipeStart = {
    x: (event.clientX - rect.left) *
       (video.videoWidth / rect.width),

    y: (event.clientY - rect.top) *
       (video.videoHeight / rect.height),

    time: Date.now()
  };

  video.setPointerCapture(event.pointerId);
});
video.addEventListener("keydown", (event) => {
  event.preventDefault();

  if (event.key === "Backspace" || event.key === "Enter") {
    socket.send(JSON.stringify({
      type: "key",
      key: event.key
    }));

    console.log("Key sent:", event.key);
    return;
  }

  if (event.key.length === 1) {
    socket.send(JSON.stringify({
      type: "text",
      text: event.key
    }));

    console.log("Text sent:", event.key);
  }
});

video.addEventListener("pointerup", (event) => {
  if (!swipeStart) {
    return;
  }

  const rect = video.getBoundingClientRect();

  const endX =
    (event.clientX - rect.left) *
    (video.videoWidth / rect.width);

  const endY =
    (event.clientY - rect.top) *
    (video.videoHeight / rect.height);

  const duration = Math.max(
    100,
    Math.min(1000, Date.now() - swipeStart.time)
  );

  const distance = Math.hypot(
    endX - swipeStart.x,
    endY - swipeStart.y
  );

  console.log(
    "Swipe:",
    swipeStart.x,
    swipeStart.y,
    "->",
    endX,
    endY,
    "distance:",
    distance
  );

  if (distance > 30) {
    socket.send(JSON.stringify({
      type: "swipe",
      startX: swipeStart.x,
      startY: swipeStart.y,
      endX: endX,
      endY: endY,
      duration: duration
    }));
  }

  swipeStart = null;
});

    

    const peerConnection = new RTCPeerConnection();

peerConnection.addTransceiver("video", {
  direction: "recvonly"
});

peerConnection.onconnectionstatechange = () => {
  console.log("Connection state:", peerConnection.connectionState);
};

peerConnection.oniceconnectionstatechange = () => {
  console.log("ICE state:", peerConnection.iceConnectionState);
};

    // Receive video from backend
   peerConnection.ontrack = async (event) => {
  console.log("Video track received");
  status.textContent = "Live";

  const stream =
    event.streams[0] || new MediaStream([event.track]);

  video.srcObject = stream;

  try {
    await video.play();
    console.log("Video playback started");
  } catch (error) {
    console.error("Video play failed:", error);
  }
};
    // Send ICE candidates to backend
    peerConnection.onicecandidate = (event) => {
      if (event.candidate) {
        socket.send(
          JSON.stringify({
            type: "candidate",
            candidate: event.candidate
          })
        );
      }
    };

    // WebSocket connected
    socket.onopen = async () => {
      console.log("WebSocket connected");

      status.textContent = "Connecting to WebRTC...";

      const offer = await peerConnection.createOffer();

      await peerConnection.setLocalDescription(offer);

      socket.send(
        JSON.stringify({
          type: "offer",
          offer: peerConnection.localDescription
        })
      );

      console.log("Offer sent");
    };

    // Messages from backend
   socket.onmessage = async (event) => {
  const data = JSON.parse(event.data);

  if (data.type === "latency") {
    const latency = Date.now() - data.serverTime;

    console.log(`Measured latency: ${latency} ms`);

    return;
  }

  if (data.type === "answer") {
    console.log("Answer received");

    await peerConnection.setRemoteDescription(
      new RTCSessionDescription(data.answer)
    );
  }

  if (data.type === "candidate") {
    await peerConnection.addIceCandidate(
      new RTCIceCandidate(data.candidate)
    );
  }
};

    socket.onerror = (error) => {
      console.error("WebSocket error:", error);
      status.textContent = "WebSocket error";
    };

    socket.onclose = () => {
      console.log("WebSocket disconnected");
      status.textContent = "Disconnected";
    };
  </script>

</body>
</html>
